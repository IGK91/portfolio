<section class="hero">
  <div class="hero__content">
    <div class="hero__title-block">
      <h1 class="hero__title">
        <span>Frontend</span>
        <span>Developer</span>
      </h1>
      <div class="hero__name-row">
        <span class="hero__line"></span>
        <p class="hero__name">{{ name }}</p>
      </div>
    </div>

    <div class="hero__bottom">
      <a class="hero__email" routerLink="/" fragment="kontakt">{{ email }}</a>

      <a class="scroll-hint" routerLink="/" fragment="ueber-mich" aria-label="Nach unten zu Über mich scrollen">
        <span class="scroll-hint__window">
          <img class="scroll-hint__arrow" src="icons/arrow-down.svg" alt="" width="54" height="96">
        </span>
        <span class="scroll-hint__text">Nach<br>unten</span>
      </a>
    </div>
  </div>
</section>
