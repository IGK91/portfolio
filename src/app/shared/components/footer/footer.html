<footer class="footer">
  @if (showScrollTop) {
    <a class="scroll-top" routerLink="/" aria-label="Nach oben scrollen">
      <img class="scroll-top__arrow" src="icons/arrow-up.svg" alt="" width="40" height="80">
      <img class="scroll-top__arrow scroll-top__arrow--hover" src="icons/arrow-up-long.svg" alt="" width="40" height="80">
    </a>
  }

  <app-social-links class="footer__social-mobile" />

  <div class="footer__brand">
    <a class="footer__logo" routerLink="/" aria-label="Zum Seitenanfang">
      <img src="img/logo-light.svg" alt="Logo Vincent Sonneck" width="67" height="30">
    </a>
    <p class="footer__copyright">© Vincent Sonneck {{ currentYear }}</p>
  </div>

  <a class="footer__email" [href]="'mailto:' + email">{{ email }}</a>

  <div class="footer__links">
    <app-social-links class="footer__social-desktop" />
    <nav class="footer__legal" aria-label="Rechtliches">
      <a class="footer__legal-link" routerLink="/impressum">Impressum</a>
      <a class="footer__legal-link" routerLink="/datenschutz">Datenschutz</a>
    </nav>
  </div>
</footer>
